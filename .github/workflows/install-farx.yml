
name: Install FARX NEXUS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract FARX
        run: |
          unzip -q FARX-NEXUS-Complete.zip -d /tmp/farx
          cp -R /tmp/farx/FARX-NEXUS/. .
          rm -rf /tmp/farx
          rm -f FARX-NEXUS-Complete.zip

      - name: Commit source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install FARX NEXUS source" || echo "No changes"
          git push
          
